<!-- Anatomia das Tags

 - Abertura de tag: <h1>
 - Conteúdo: Título
 - Fechamento de tag: </h1>
 - Elementos: <h1>Título</h1>
 - Atributos: id="title"

Segundo o exemplo abaixo, de uma tag com elementos:
-->
<h1 id="title">Título</h1>

<!-- Tag com elemento vazio
 
 - Não possuem conteúdo;
 - Poderão conter atributos.
-->
<img src="" alt="" />
